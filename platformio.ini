; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-atom

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:ota_password.py
build_flags =
    -DCORE_DEBUG_LEVEL=4
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    m5stack/M5Atom @ ^0.1.3
    fastled/FastLED @ ^3.10.3
    m5stack/M5Atomic-EchoBase @ ^1.0.0
    kosme/arduinoFFT @ ^2.0.4

; Network update of a running mic: OTA_PASSWORD as for the build, OTA_HOST its address and
; OTA_HOST_PORT the port it connects back to, which the uploading host must accept from it.
[env:m5stack-atom-ota]
extends = env:m5stack-atom
upload_protocol = espota
upload_port = ${sysenv.OTA_HOST}
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
    --host_port=${sysenv.OTA_HOST_PORT}
